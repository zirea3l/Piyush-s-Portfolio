<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Portfolio Console · Piyush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap">

<style>
:root{--bg:#111113;--panel:#19191b;--text:#f3efe9;--mute:#9a968f;--pink:#E4A5CA;--orange:#EC6426;--amber:#F8A91F;--cream:#FDE3CF;--ink:#66271B;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.wrap{width:min(100% - 2.5rem,1320px);margin-inline:auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;padding:1.25rem 0}
.logo{font-weight:600;font-size:1.35rem;letter-spacing:-.02em;text-decoration:none;flex:1}
.logo i{color:var(--orange);font-style:normal}
nav{display:flex;gap:.25rem;justify-content:center}
nav button,.talk{font:500 .95rem Inter,sans-serif;color:var(--text);background:none;border:0;padding:.5rem .9rem;border-radius:99px;cursor:pointer;text-decoration:none}
nav button:hover,.talk:hover{background:#ffffff14}
.right{flex:1;display:flex;justify-content:flex-end}
.talk{border:1px solid #ffffff2e}
@media(max-width:760px){nav{order:3;flex-basis:100%;flex-wrap:wrap}.right{flex:0}.logo{flex:0 0 auto}header{justify-content:space-between}}
.intro{text-align:center;padding:2.2rem 0 1.4rem}
.avail{display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--mute);margin-bottom:1rem}
.avail::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:#72AC43}
h1{margin:0;font-weight:300;font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.1;letter-spacing:-.03em}
#nm{color:var(--pink);border-bottom:2px solid var(--pink);outline-offset:6px;cursor:text;white-space:nowrap}
.intro p{margin:.9rem auto 0;max-width:34ch;color:var(--mute);font-size:1.1rem}
.device{position:relative;container-type:inline-size;width:min(100%,1120px);margin:1.2rem auto 0;aspect-ratio:1536/1024;user-select:none}
.device img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.screen{position:absolute;left:21.8%;top:17.9%;width:56.9%;height:15.3%;transform:rotate(-3deg) skewX(5deg);padding:1.3cqw 1.9cqw;overflow:hidden;font-family:"Courier New",Courier,monospace;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.meta{display:flex;justify-content:space-between;font-size:.8cqw;letter-spacing:.12em;color:var(--amber)}
.ttl{margin:0;font-size:3.35cqw;line-height:1.1;font-weight:700;color:var(--cream);text-shadow:0 0 1.2cqw #fde3cf40;white-space:nowrap;overflow:hidden}
.caret{display:inline-block;width:.3cqw;height:2.7cqw;background:var(--amber);vertical-align:-.2cqw;margin-left:.2cqw;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dsc{margin:0;font-size:1.05cqw;line-height:1.35;color:#8f8b85;max-height:2.9cqw;overflow:hidden}
.key{position:absolute;padding:0;border:0;background:none;display:block;text-decoration:none;cursor:pointer;transform:rotate(-3.2deg) skewX(4.8deg);-webkit-tap-highlight-color:transparent}
.key:focus-visible{outline:.25cqw solid #fff;outline-offset:.2cqw;border-radius:1.6cqw}
.side{position:absolute;inset:0;border-radius:1.6cqw;background:linear-gradient(var(--b),color-mix(in srgb,var(--b) 65%,#000));box-shadow:0 .35cqw .7cqw #000b}
.face{position:absolute;inset:0;border-radius:1.6cqw;pointer-events:none;color:var(--i);display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c) 22%);
 box-shadow:inset 0 .14cqw 0 #ffffff70,inset 0 -.3cqw .5cqw #0000002e;
 transform:translateY(-.8cqw);transition:transform .4s cubic-bezier(.22,1.5,.4,1);
 animation:pop 7s infinite both;animation-delay:calc(var(--n)*85ms)}
.g{font:800 4.3cqw/1 Inter,sans-serif}
.sm .g{font-size:3.5cqw}
.sl{font:600 .62cqw/1.1 Inter,sans-serif;letter-spacing:.05em;margin-top:.5cqw;text-align:center}
.bar .face{flex-direction:row;justify-content:space-between;padding:0 4cqw}
.bar .g{font-size:3.4cqw}.bar .sl{font-size:1.15cqw;margin:0}
.key:hover .face,.key:focus-visible .face{transform:translateY(-2.7cqw)}
.key:active .face{transform:translateY(-.1cqw);transition-duration:.08s}
@keyframes pop{0%{transform:translateY(-.8cqw);animation-timing-function:cubic-bezier(.1,.9,.3,1)}
 3.5%{transform:translateY(-3.8cqw);animation-timing-function:ease-in-out}7%{transform:translateY(-.2cqw)}
 10.5%{transform:translateY(-1.3cqw)}15.7%,100%{transform:translateY(-.8cqw)}}
.device.busy .face,.device:has(.key:focus-visible) .face,.modal .face,.hid .face{animation:none}
.strip{overflow:hidden;border-block:1px solid #ffffff17;margin:2.2rem 0 4rem;padding:1rem 0;color:#cfc8bd;font-size:.95rem;white-space:nowrap}
.strip div{display:inline-block;animation:slide 40s linear infinite}
.strip span{margin:0 1.2rem}.strip b{color:var(--amber);font-weight:400}
@keyframes slide{to{transform:translateX(-50%)}}
#contact{background:var(--panel);padding:5rem 0 6rem}
#contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:end;max-width:960px}
#contact h2{margin:0;font-weight:300;font-size:clamp(2.2rem,4.5vw,3.3rem);line-height:1.05;letter-spacing:-.03em}
#contact p{margin:0 0 1rem;font-size:1.15rem;color:#d4cfc7;max-width:30ch}
#contact a{color:var(--pink);text-decoration:none;border-bottom:1px solid var(--pink);padding-bottom:2px;font-size:1.05rem}
@media(max-width:700px){#contact .wrap{grid-template-columns:1fr}}
dialog{padding:0;border:1px solid #ffffff26;border-radius:1.2rem;background:#1c1c1f;color:var(--text);width:min(92vw,560px)}
dialog::backdrop{background:#000c}
.box{padding:2rem}
.box h2{margin:0 0 .8rem;font-weight:500;font-size:1.8rem;letter-spacing:-.02em}
.box p{margin:0 0 1.5rem;color:#d4cfc7;font-size:1.1rem;max-width:44ch}
.box .note{color:var(--mute);font-size:.95rem}
.close{font:500 .95rem Inter,sans-serif;color:#111;background:var(--cream);border:0;border-radius:99px;padding:.6rem 1.3rem;cursor:pointer}
@media(max-width:600px){.sl{display:none}}
@media(prefers-reduced-motion:reduce){.face{animation:none!important;transition:none}.key:hover .face,.key:focus-visible .face{filter:brightness(1.15);transform:translateY(-.8cqw)}.caret{animation:none}.strip div{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <a class="logo" href="#top" id="top">Piyush<i>.</i></a>
  <nav aria-label="Sections">
   <button data-open="work">Work</button><button data-open="about">About</button><button data-open="process">Process</button><button data-open="services">Services</button>
  </nav>
  <div class="right"><a class="talk" href="#contact">Let’s Talk</a></div>
 </header>
 <main>
  <section class="intro">
   <div class="avail">Available for work</div>
   <h1>Hi, I’m <span id="nm" contenteditable="plaintext-only" role="textbox" aria-label="Display name, editable" spellcheck="false">Piyush</span></h1>
   <p>A full-stack builder turning half-formed ideas into things people can use.</p>
  </section>
  <div class="device" id="dev">
   <img alt="" src="device.webp">
   <div class="screen">
    <div class="meta"><span>PIYUSH / CREATIVE INDEX</span><span id="ts">READY</span></div>
    <div><div class="ttl" id="th" role="heading" aria-level="2"><span id="tt" aria-hidden="true"></span><i class="caret" aria-hidden="true"></i></div></div>
    <p class="dsc" id="td"></p>
   </div>
  </div>
  <div class="strip" aria-label="Trusted by 30 brands. 50 apps built."><div id="mq"></div></div>
 </main>
</div>
<section id="contact">
 <div class="wrap">
  <h2>Good design starts with hello.</h2>
  <div><p>Have a project in mind, a half-formed idea, or just want to say hi?</p><a href="mailto:piyushrs007@gmail.com">piyushrs007@gmail.com ↗</a></div>
 </div>
</section>
<dialog id="dlg" aria-labelledby="dh"><div class="box"><h2 id="dh"></h2><p id="db"></p><p class="note" id="dn"></p><button class="close" type="button" id="dx">Close</button></div></dialog>
<script>
const W=1536,H=1024,TOP='#66271B',CR='#FDE3CF';
const K=[
['P','SELECTED WORK','Selected Work','work',379,590,156,130,'#EC6426','#AD4017',TOP],
['O','ABOUT ME','About','about',580,580,156,130,'#F8A91F','#BC7512',TOP],
['R','MY PROCESS','Process','process',782,570,156,130,'#FDE3CF','#CAA58A',TOP],
['T','WHAT I DO','Services','services',982,559,156,130,'#2E573A','#193A23',CR],
['F','EXPLORE','Selected Work','work',1184,548,156,130,'#72AC43','#487A26',TOP],
['O','A LITTLE ABOUT ME','About','about',355,783,98,108,'#E4A5CA','#B76F9B',TOP],
['L','THE PROCESS','Process','process',479,776,98,108,'#66271B','#40150E',CR],
['I','MY APPROACH','Services','services',602,770,98,108,'#EC6426','#AD4017',TOP],
['O','SAY HELLO','Say hello','contact',728,763,98,108,'#F8A91F','#BC7512',TOP],
['✦','PORTFOLIO','Explore my portfolio','work',852,756,98,108,'#E4A5CA','#B76F9B',TOP],
['↵','LET’S TALK','Let’s talk','contact',1135,745,374,112,'#252525','#101010','#fff']];
const S={
work:['Selected Work','Selected website and identity concepts.','Projects will be added here once Piyush shares them.'],
about:['About','Welcome to my portfolio. A little personality. A lot of possibility.',''],
process:['Process','We start with a conversation, shape the design together, then build and launch.',''],
services:['Services','Thoughtful design, clear communication, and a website built around your business.',''],
contact:['Let’s talk','Have a project in mind? Say hello.','']};
const $=s=>document.querySelector(s),dev=$('#dev'),T=$('#tt'),D=$('#td'),St=$('#ts'),Hd=$('#th'),dlg=$('#dlg'),nm=$('#nm');
const rm=matchMedia('(prefers-reduced-motion: reduce)');
let name='Piyush';try{name=localStorage.getItem('piyush-name')||name}catch(e){}
nm.textContent=name;
const welcome=()=>[name+'’s portfolio','A curious mind. A world of possibilities.'];
let timer=0,rt=0,shown=null,opener=null;
function say(t,d,pause){
 clearTimeout(rt);if(t===shown)return;
 clearTimeout(timer);shown=t;D.textContent=d;Hd.setAttribute('aria-label',t);
 if(rm.matches){T.textContent=t;St.textContent='READY';return}
 T.textContent='';St.textContent='TYPING';let i=0;
 const step=()=>{i++;T.textContent=t.slice(0,i);if(i<t.length)timer=setTimeout(step,110);else St.textContent='READY'};
 pause?timer=setTimeout(step,pause):step();
}
function back(){clearTimeout(rt);rt=setTimeout(()=>{
 if(dlg.open||document.activeElement?.closest('.key'))return;say(...welcome())},350)}
const desc=d=>S[d][1];
K.forEach((k,n)=>{
 const [g,sl,t,d,x,y,w,h,c,b,ink]=k,a=d==='contact',e=document.createElement(a?'a':'button');
 if(a)e.href='#contact';else{e.type='button';e.dataset.open=d}
 e.className='key'+(w>200?' bar':h<120?' sm':'');
 e.setAttribute('aria-label',sl.charAt(0)+sl.slice(1).toLowerCase());
 e.style.cssText=`left:${(x-w/2)/W*100}%;top:${(y-h/2)/H*100}%;width:${w/W*100}%;height:${h/H*100}%;--c:${c};--b:${b};--i:${ink};--n:${n}`;
 e.innerHTML=`<span class="side"></span><span class="face" style="--n:${n}"><span class="g" aria-hidden="true">${g}</span><span class="sl" aria-hidden="true">${sl}</span></span>`;
 const on=()=>say(t,desc(d));
 e.addEventListener('pointerenter',on);e.addEventListener('focus',on);
 e.addEventListener('pointerleave',back);e.addEventListener('blur',back);
 dev.appendChild(e);
});
dev.addEventListener('pointerenter',()=>dev.classList.add('busy'));
dev.addEventListener('pointerleave',()=>dev.classList.remove('busy'));
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('hid',document.hidden));
function open(id,el){opener=el;const s=S[id];$('#dh').textContent=s[0];$('#db').textContent=s[1];$('#dn').textContent=s[2];
 document.documentElement.classList.add('modal');dlg.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(b.dataset.open,b)});
$('#dx').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>{document.documentElement.classList.remove('modal');opener&&opener.focus();back()});
nm.addEventListener('input',()=>{if(nm.textContent.length>14)nm.textContent=nm.textContent.slice(0,14)});
nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nm.blur()}});
nm.addEventListener('blur',()=>{name=nm.textContent.trim()||'Piyush';nm.textContent=name;
 try{localStorage.setItem('piyush-name',name)}catch(e){}
 if(shown&&/’s portfolio$/.test(shown)){shown=null;clearTimeout(timer);T.textContent='';say(...welcome())}});
const m='Trusted by 30 brands <b>✦</b> 50 apps built <b>✦</b> ';
$('#mq').innerHTML=('<span>'+m+'</span>').repeat(14);
say(...welcome(),350);
</script>
</body>
</html>
